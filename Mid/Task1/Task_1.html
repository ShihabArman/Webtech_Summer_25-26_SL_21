<!DOCTYPE html>
<html>
    <head>
        <title> Student Information </title>
    </head>

    <body>
        <center>
            <h1> Student Information for Internship </h1>
        </center>
        <form>
            <table>
                <tr>
                    <td> Student Name : </td>
                    <td> <input type = "text" name ="fname"> </td>
                </tr>
                 
                <tr>
                    <td> Student Email Address: </td>
                    <td> <input type = "text" email ="emailaddress"> </td>
                </tr>

                 <tr>
                    <td> Preferred Internship : </td>
                    <td> <input type = "radio" name ="preffered" value = "On site"> On site  </td>
                    <td> <input type = "radio" name ="preffered" value = "Remote"> Remote  </td>
                </tr>
                 
                <tr>
                    <td>Internship Duration: </td>
                    <td>
                        <select name = " int duration">
                            <option value = "6 Weeks "> 6 Weeks </option>
                            <option value = "3 Months "> 3 Months </option>
                        </select>
                    </td>
                </tr>

                 <tr>
                    <td> Skills of Interest : </td>
                    <td> <input type = "checkbox" name ="lang" value = "webdevelopment"> Web Development  </td>
                    <td> <input type = "checkbox" name ="lang" value = "dataanalysis"> Data Analysis  </td>
                    <td> <input type = "checkbox" name ="lang" value = "mobileapps"> Mobile Apps  </td>
                </tr>
                <tr>
                    <td>
                        <input type = "submit" name "submit" value ="Submit">
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
